name: Build and publish APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare download
        run: cp app/build/outputs/apk/debug/app-debug.apk KG-Piseiro-Keys.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KG-Piseiro-Keys-APK
          path: KG-Piseiro-Keys.apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest KG-Piseiro-Keys.apk --title "KG Piseiro Keys - APK" --notes "Versão de teste Android (APK debug)." --latest

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KG Piseiro Keys</title><style>*{box-sizing:border-box}body{margin:0;background:#10131b;color:white;font:14px system-ui;touch-action:manipulation}header{padding:10px;background:#222a3b;display:flex;justify-content:space-between;align-items:center}h2{margin:0;font-size:17px}section{display:flex;flex-wrap:wrap;gap:8px;padding:9px}button,select,input{font:inherit;border:1px solid #59677d;border-radius:7px;padding:9px;background:#28364e;color:white}button.active{background:#087d8b}label{display:flex;align-items:center;gap:5px}#keys{height:45vh;min-height:170px;display:flex;position:relative;margin:6px;touch-action:none;user-select:none} .white{flex:1;background:linear-gradient(#fff,#c9d3e4);border:1px solid #3a4559;border-radius:0 0 6px 6px;color:#293143;position:relative;text-align:center;padding-top:33vh;font-size:11px} .white.on{background:#67d6ea}.black{position:absolute;top:0;height:60%;width:5.5%;background:linear-gradient(#34394b,#05070a);border-radius:0 0 5px 5px;z-index:2;transform:translateX(-50%)}.black.on{background:#00b9cf}small{color:#9baecc}#status{padding:4px 12px;color:#a5e7ed}#chords button{min-width:60px}#lesson{padding:4px 12px;color:#ffd27a}@media(orientation:portrait){#keys{height:38vh}.white{padding-top:27vh}} </style></head><body><header><h2>🎹 KG Piseiro Keys 3.0</h2><button id="audio">ATIVAR SOM</button></header><section><label>Timbre <select id="voice"><option value="accordion">Sanfona</option><option value="lead">Lead piseiro</option><option value="organ">Órgão</option><option value="piano">Piano</option><option value="brass">Metais</option></select></label><label>Ritmo <select id="style"><option>Piseiro</option><option>Forró</option><option>Vanerão</option><option>Arrocha</option><option>Sertanejo</option></select></label><label>BPM <input id="bpm" type="number" min="60" max="200" value="110" style="width:75px"></label><button id="play">▶ Ritmo</button><button id="fill">Virada</button><button id="octDown">− Oitava</button><button id="octUp">+ Oitava</button></section><section id="chords"></section><div id="lesson">Treino: Fm → A♭ → E♭ → B♭m (exercício, não transcrição da música)</div><div id="status">Toque em ATIVAR SOM antes de tocar.</div><div id="keys"></div><script>
let ctx,master,oct=0,playing=false,step=0,timer=null,active=new Map(),chord='Fm';const roots={Fm:53,'A♭':56,'E♭':51,'B♭m':58,C:48,G:55,Am:57,F:53};const tones={Fm:[0,3,7],'A♭':[0,4,7],'E♭':[0,4,7],'B♭m':[0,3,7],C:[0,4,7],G:[0,4,7],Am:[0,3,7],F:[0,4,7]};const $=x=>document.getElementById(x);function init(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.45;master.connect(ctx.destination)}ctx.resume();$('audio').textContent='SOM ATIVO'}function hz(n){return 440*Math.pow(2,(n-69)/12)}function note(n,d=.6,type=$('voice').value,vol=.3){if(!ctx)return()=>{};let now=ctx.currentTime,osc=ctx.createOscillator(),g=ctx.createGain(),filter=ctx.createBiquadFilter();osc.type=type==='piano'?'triangle':type==='organ'?'sine':type==='brass'?'sawtooth':type==='lead'?'square':'sawtooth';osc.frequency.value=hz(n);filter.type='lowpass';filter.frequency.value=type==='accordion'?1750:3000;osc.connect(filter);filter.connect(g);g.connect(master);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.025);g.gain.setTargetAtTime(.0001,now+Math.max(.09,d-.12),.1);osc.start(now);osc.stop(now+d+.25);return()=>{try{g.gain.setTargetAtTime(.0001,ctx.currentTime,.025);osc.stop(ctx.currentTime+.12)}catch(e){}}}function drum(f,d=.12,v=.25){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(35,f*.4),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.01)}function beat(){if(!playing||!ctx)return;let style=$('style').value;let speed=60000/Math.max(60,Math.min(200,+$('bpm').value||110));let s=step++%8;if(s===0||s===4)drum(125,.19,.65);if(s===2||s===6)drum(220,.07,.22);if(style!=='Arrocha'||s%2===0)drum(900,.023,.06);if(s%2===0)note(roots[chord]-12+(s===4?7:0),.25,'organ',.12);if(s===2||s===6)tones[chord].forEach(t=>note(roots[chord]+t,.22,'organ',.07));timer=setTimeout(beat,speed/2)}function stop(){playing=false;clearTimeout(timer);$('play').textContent='▶ Ritmo'}$('audio').onclick=init;$('play').onclick=()=>{init();if(playing)stop();else{playing=true;step=0;$('play').textContent='■ Parar';beat()}};$('fill').onclick=()=>{init();for(let i=0;i<4;i++)setTimeout(()=>drum(170+i*90,.08,.24),i*100)};$('octDown').onclick=()=>{oct=Math.max(-2,oct-1);draw()};$('octUp').onclick=()=>{oct=Math.min(2,oct+1);draw()};for(let c of Object.keys(roots)){let b=document.createElement('button');b.textContent=c;b.onclick=()=>{chord=c;document.querySelectorAll('#chords button').forEach(x=>x.classList.toggle('active',x===b));init();tones[c].forEach(t=>note(roots[c]+t,.5,'accordion',.13))};$('chords').appendChild(b);if(c===chord)b.classList.add('active')}const whites=[0,2,4,5,7,9,11,12,14,16,17,19,21,23],blackPositions=[1,3,6,8,10,13,15,18,20,22];function draw(){let k=$('keys');k.innerHTML='';whites.forEach((n,i)=>{let e=document.createElement('div');e.className='white';e.dataset.n=60+oct*12+n;e.textContent=['Dó','Ré','Mi','Fá','Sol','Lá','Si'][i%7];k.appendChild(e)});blackPositions.forEach(n=>{let previous=whites.filter(w=>w<n).length;let e=document.createElement('div');e.className='black';e.dataset.n=60+oct*12+n;e.style.left=(previous/whites.length*100)+'%';k.appendChild(e)})}draw();function down(e){let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-n]');if(!el||active.has(e.pointerId))return;init();el.classList.add('on');let release=note(+el.dataset.n,2);active.set(e.pointerId,{el,release});$('status').textContent='Nota MIDI '+el.dataset.n}function up(e){let a=active.get(e.pointerId);if(a){a.el.classList.remove('on');a.release();active.delete(e.pointerId)}}$('keys').addEventListener('pointerdown',e=>{e.preventDefault();try{e.target.setPointerCapture(e.pointerId)}catch(x){}down(e)});$('keys').addEventListener('pointerup',up);$('keys').addEventListener('pointercancel',up);window.addEventListener('blur',()=>{active.forEach(a=>a.release());active.clear();stop()});</script></body></html>
